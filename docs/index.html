<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightgram</title>
<style>
  :root{
    --void-0: #06070f;
    --void-1: #0c0e22;
    --void-2: #1a1240;
    --silver: #eef0f6;
    --silver-dim: #9aa0bd;
    --line: rgba(238,240,246,0.14);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: var(--void-0);
    color: var(--silver);
    font-family: 'Manrope', -apple-system, 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(ellipse 900px 700px at 78% 8%, rgba(120,110,180,0.20), transparent 60%),
      linear-gradient(200deg, var(--void-1) 0%, var(--void-0) 55%, #14081f 100%);
  }

  canvas#stars{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:0;
  }

  .moon{
    position:fixed;
    top:-6vw; right:-6vw;
    width:34vw; height:34vw;
    min-width:220px; min-height:220px;
    max-width:520px; max-height:520px;
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 34%, #f4f4f8 0%, #cfd0da 42%, #9698a6 78%, #6d6f7c 100%);
    box-shadow: 0 0 120px 10px rgba(200,200,230,0.10);
    opacity:0.9;
    z-index:0;
  }
  .moon::before{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 70%, rgba(0,0,0,0.18) 0 6%, transparent 7%),
      radial-gradient(circle at 60% 30%, rgba(0,0,0,0.14) 0 9%, transparent 10%),
      radial-gradient(circle at 70% 68%, rgba(0,0,0,0.16) 0 5%, transparent 6%),
      radial-gradient(circle at 42% 52%, rgba(0,0,0,0.10) 0 12%, transparent 13%);
  }

  main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: 8vh 24px;
    animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .icon-wrap{
    position:relative;
    width:132px; height:132px;
    margin-bottom:36px;
  }
  .icon-wrap img{
    width:100%; height:100%;
    border-radius: 29px;
    display:block;
    box-shadow:
      0 20px 60px -10px rgba(60,50,120,0.55),
      0 0 0 1px rgba(255,255,255,0.06);
  }
  .icon-glow{
    position:absolute; inset:-30px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(150,140,220,0.35), transparent 70%);
    filter: blur(6px);
    z-index:-1;
    animation: pulse 4.5s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.55; transform:scale(0.96); }
    50%{ opacity:0.9; transform:scale(1.06); }
  }

  h1{
    font-family: 'Space Grotesk', 'Manrope', sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    letter-spacing: 0.01em;
    line-height:1.05;
    background: linear-gradient(180deg, #ffffff 0%, #cfd2e6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline{
    margin-top:14px;
    font-size: 1rem;
    color: var(--silver-dim);
    letter-spacing: 0.02em;
    font-weight:400;
  }

  .cta{
    margin-top:48px;
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding: 16px 34px;
    border-radius: 999px;
    background: var(--silver);
    color: #0c0e22;
    font-weight:700;
    font-size:1.05rem;
    text-decoration:none;
    letter-spacing:0.01em;
    position:relative;
    transition: transform .25s ease, box-shadow .25s ease;
    box-shadow: 0 10px 40px -8px rgba(238,240,246,0.35);
  }
  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 16px 50px -8px rgba(238,240,246,0.5);
  }
  .cta:active{ transform: translateY(0); }
  .cta svg{ width:18px; height:18px; }

  .meta{
    margin-top:22px;
    font-size:0.8rem;
    color: rgba(154,160,189,0.65);
    letter-spacing:0.03em;
  }

  footer{
    position:fixed;
    bottom:18px;
    left:0; right:0;
    text-align:center;
    z-index:2;
    font-size:0.72rem;
    color: rgba(154,160,189,0.4);
    letter-spacing:0.04em;
  }

  .social-links{
    position:fixed;
    bottom:16px;
    right:16px;
    z-index:3;
    display:flex;
    gap:10px;
  }
  .social-links a{
    width:34px; height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background: rgba(154,160,189,0.10);
    border:1px solid rgba(154,160,189,0.22);
    color: var(--silver-dim);
    transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .social-links a:hover{
    background: rgba(154,160,189,0.20);
    color: var(--silver);
    transform: translateY(-2px);
  }
  .social-links svg{
    width:16px; height:16px;
  }
  @media (max-width: 480px){
    .social-links{ bottom:12px; right:12px; }
    .social-links a{ width:30px; height:30px; }
    .social-links svg{ width:14px; height:14px; }
  }

  @media (prefers-reduced-motion: reduce){
    .icon-glow{ animation:none; }
    main{ animation:none; }
  }
</style>
</head>

<script>
  // Starfield
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 6000);
    stars = Array.from({length: count}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      a: Math.random() * 0.6 + 0.25,
      speed: Math.random() * 0.015 + 0.003,
      phase: Math.random() * Math.PI * 2
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  let t = 0;
  function draw(){
    t += 1;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(const s of stars){
      const flicker = s.a + Math.sin(t * s.speed + s.phase) * 0.25;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(238,240,246,${Math.max(0, Math.min(1, flicker))})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
